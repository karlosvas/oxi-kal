[package]
name = "oxide-kcal"
description = "oxide::kcal — registro de calorías y peso"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "oxide-kcal"
path = "src/main.rs"

[dependencies]
slint = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
log = "0.4"
oxide-theme = { workspace = true }
# Dictado por voz: whisper.cpp en el propio dispositivo.
whisper-rs = { version = "0.16", features = ["log_backend"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06", "renderer-femtovg"] }
android_logger = { version = "0.15", default-features = false }
# Micrófono (AAudio) y modelo de voz desde los assets del APK; las mismas versiones que usa Slint.
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-30"] }
jni = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

[features]
# Pruebas en el emulador: usa `voice-test.wav` (en la carpeta externa de la app) en vez del micrófono.
voice-test = []

[build-dependencies]
slint-build = { workspace = true }
oxide-theme = { workspace = true }

# ───────────── APK (cargo apk build --lib --release) ─────────────

[package.metadata.android]
package = "dev.oxide.kcal"
apk_name = "oxide-kcal"
build_targets = ["aarch64-linux-android"]
resources = "android/res"
# Modelo de voz (tools/whisper-model.sh).
assets = "assets"

# Dictado: micrófono y vibración al grabar.
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[package.metadata.android.sdk]
min_sdk_version = 34
target_sdk_version = 35

[package.metadata.android.application]
label = "kcal"
icon = "@mipmap/ic_launcher"
theme = "@style/Oxide"

[package.metadata.android.application.activity]
# Gira con el teléfono (respeta el bloqueo de rotación del sistema).
orientation = "user"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
launch_mode = "singleTask"

# Firma de release con la clave de depuración local: es una app personal y así las
# actualizaciones se instalan encima sin desinstalar (los datos se conservan).
[package.metadata.android.signing.release]
path = "/home/karlos/.android/debug.keystore"
keystore_password = "android"
